<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Go AI 交互体验原型</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap');
        
        body { font-family: 'Inter', sans-serif; background: #1a1a1a; display: flex; justify-content: center; align-items: center; height: 100vh; overflow: hidden; }

        /* 模拟手机容器 */
        .phone-mockup {
            width: 375px;
            height: 750px;
            background: #000;
            border: 12px solid #333;
            border-radius: 40px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 50px 100px rgba(0,0,0,0.5);
        }

        /* 模拟围棋App背景 */
        .bg-app {
            width: 100%; height: 100%;
            object-fit: cover;
            filter: brightness(0.8);
        }

        /* 全屏透明蒙版 - 关键：用于监听外部点击 */
        #dismiss-layer {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.4);
            z-index: 40;
            display: none; /* 默认隐藏 */
            backdrop-filter: blur(2px);
        }

        /* 悬浮球 */
        .floating-ball {
            width: 50px; height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            position: absolute;
            right: 15px; top: 120px;
            z-index: 100;
            cursor: pointer;
            display: flex; justify-content: center; align-items: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: transform 0.2s;
        }
        .floating-ball:active { transform: scale(0.9); }
        .stone-icon { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #444, #000); border: 1px solid #666; position: relative; }
        .stone-icon::after { content: ''; position: absolute; top: 2px; right: 2px; width: 15px; height: 15px; background: #fff; border-radius: 50%; border: 1px solid #ccc; }

        /* 三合一交互卡片 */
        .main-card {
            position: absolute;
            left: 20px; top: 180px; /* 避开悬浮球位置 */
            width: 280px;
            background: rgba(30, 41, 59, 0.95);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 30px;
            z-index: 50;
            padding: 24px;
            color: white;
            display: none; /* 默认隐藏 */
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transform-origin: top right;
        }

        /* 按钮样式 */
        .btn-blue { background: #2563eb; width: 100%; padding: 12px; border-radius: 16px; font-weight: bold; transition: all 0.2s; }
        .btn-blue:active { transform: scale(0.98); background: #1d4ed8; }

        /* 加载动画 */
        .spinner {
            width: 40px; height: 40px;
            border: 4px solid rgba(255,255,255,0.1);
            border-top-color: #2563eb;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* 结果行样式 */
        .result-row { display: flex; justify-content: space-between; align-items: center; padding: 10px 14px; background: rgba(0,0,0,0.2); border-radius: 12px; margin-bottom: 8px; }

        /* 进入动画 */
        .animate-in { animation: popIn 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn {
            from { opacity: 0; transform: scale(0.9) translateY(10px); }
            to { opacity: 1; transform: scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <div class="phone-mockup">
        <!-- 模拟App底图 -->
        <img src="https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=800" class="bg-app">

        <!-- 全屏蒙版层 -->
        <div id="dismiss-layer" onclick="closeUI()"></div>

        <!-- 悬浮球 -->
        <div class="floating-ball" onclick="toggleUI()">
            <div class="stone-icon"></div>
        </div>

        <!-- 交互主卡片 -->
        <div id="main-card" class="main-card">
            
            <!-- 状态 1: IDLE (主菜单) -->
            <div id="state-idle">
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-1">当前模型 / MODEL</p>
                <h4 class="text-sm font-semibold mb-4 text-blue-400">小米14-野狐围棋 (19×19)</h4>
                
                <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest mb-2">执子方向 / SIDE</p>
                <div class="flex gap-2 mb-6">
                    <button id="sideB" onclick="setSide('B')" class="flex-1 py-2 bg-white text-black text-xs font-bold rounded-xl border-2 border-white">黑棋 B</button>
                    <button id="sideW" onclick="setSide('W')" class="flex-1 py-2 bg-slate-800 text-slate-400 text-xs font-bold rounded-xl border-2 border-slate-700">白棋 W</button>
                </div>

                <button class="btn-blue text-sm" onclick="goAnalyze()">开始 AI 分析</button>
            </div>

            <!-- 状态 2: ANALYZING (加载中) -->
            <div id="state-loading" class="hidden py-8 flex flex-col items-center">
                <div class="spinner mb-4"></div>
                <p class="text-sm font-medium text-slate-300">正在识别棋盘数据...</p>
            </div>

            <!-- 状态 3: RESULT (结果) -->
            <div id="state-result" class="hidden">
                <div class="flex justify-between items-center mb-4">
                    <h4 class="text-xs font-bold text-slate-400 tracking-widest">AI 推荐落子</h4>
                    <span class="text-[10px] bg-red-500/20 text-red-400 px-2 py-0.5 rounded">Score: +1.2</span>
                </div>
                
                <div class="space-y-2 max-h-[220px] overflow-y-auto pr-1">
                    <div class="result-row border-l-4 border-red-500">
                        <span class="text-xs font-bold text-slate-200">1. K9 (点三三)</span>
                        <span class="text-[11px] font-mono text-green-400 font-bold">83%</span>
                    </div>
                    <div class="result-row border-l-4 border-blue-500">
                        <span class="text-xs font-bold text-slate-200">2. K18 (挂角)</span>
                        <span class="text-[11px] font-mono text-blue-400">79%</span>
                    </div>
                    <div class="result-row border-l-4 border-blue-500">
                        <span class="text-xs font-bold text-slate-200">3. L17 (拆边)</span>
                        <span class="text-[11px] font-mono text-blue-400">75%</span>
                    </div>
                </div>

                <p class="text-[9px] text-slate-500 text-center mt-4 italic">点击屏幕任意位置关闭</p>
            </div>

        </div>
    </div>

    <script>
        const card = document.getElementById('main-card');
        const dismissLayer = document.getElementById('dismiss-layer');
        const states = {
            idle: document.getElementById('state-idle'),
            loading: document.getElementById('state-loading'),
            result: document.getElementById('state-result')
        };

        let isOpen = false;

        // 切换 UI 展开/收起
        function toggleUI() {
            if (isOpen) {
                closeUI();
            } else {
                openUI();
            }
        }

        function openUI() {
            isOpen = true;
            card.style.display = 'block';
            card.classList.add('animate-in');
            dismissLayer.style.display = 'block';
            switchState('idle');
        }

        function closeUI() {
            isOpen = false;
            card.style.display = 'none';
            dismissLayer.style.display = 'none';
        }

        // 切换内部状态
        function switchState(stateName) {
            Object.keys(states).forEach(key => {
                states[key].classList.toggle('hidden', key !== stateName);
            });
        }

        // 模拟分析逻辑
        function goAnalyze() {
            switchState('loading');
            
            // 模拟 1.5 秒后返回结果
            setTimeout(() => {
                switchState('result');
            }, 1500);
        }

        // 选色交互
        function setSide(side) {
            const b = document.getElementById('sideB');
            const w = document.getElementById('sideW');
            if(side === 'B') {
                b.className = "flex-1 py-2 bg-white text-black text-xs font-bold rounded-xl border-2 border-white transition-all";
                w.className = "flex-1 py-2 bg-slate-800 text-slate-400 text-xs font-bold rounded-xl border-2 border-slate-700 transition-all";
            } else {
                w.className = "flex-1 py-2 bg-white text-black text-xs font-bold rounded-xl border-2 border-white transition-all";
                b.className = "flex-1 py-2 bg-slate-800 text-slate-400 text-xs font-bold rounded-xl border-2 border-slate-700 transition-all";
            }
        }
    </script>
</body>
</html>
