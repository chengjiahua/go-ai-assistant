<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Board Vision Pro - 极致交互</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Inter:wght@400;600;800&display=swap');
        
        :root {
            --cyan-glow: #00f2ff;
            --purple-glow: #7000ff;
        }

        body { font-family: 'Inter', sans-serif; background: #020617; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; }

        /* 手机框架 */
        .phone {
            width: 380px; height: 820px;
            background: #000; border: 12px solid #1e293b; border-radius: 54px;
            position: relative; overflow: hidden; box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        .board-bg { width: 100%; height: 100%; object-fit: cover; opacity: 0.85; }

        /* 全屏透明交互层 */
        #ai-overlay-layer {
            position: absolute; inset: 0; z-index: 80;
            display: none; background: rgba(0,0,0,0.2); backdrop-filter: blur(1px);
        }

        /* --- 炫酷 AI 棋子设计 --- */
        .ai-stone-container {
            position: absolute;
            transform: translate(-50%, -50%); /* 确保(x,y)是中心点 */
            display: flex; justify-content: center; align-items: center;
            animation: stonePop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* 外部呼吸环 */
        .energy-ring {
            position: absolute;
            inset: -4px;
            border: 2px solid var(--cyan-glow);
            border-radius: 50%;
            animation: ringPulse 2s infinite ease-in-out;
            box-shadow: 0 0 15px var(--cyan-glow);
        }

        /* 棋子主体 */
        .ai-stone-body {
            width: 100%; height: 100%;
            border-radius: 50%;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            position: relative; overflow: hidden;
            backdrop-filter: blur(4px);
        }

        /* 黑子：黑洞质感 */
        .stone-black {
            background: radial-gradient(circle at 30% 30%, #334155 0%, #000 70%);
            border: 1px solid rgba(255,255,255,0.2);
            color: #fff;
        }
        /* 白子：极光质感 */
        .stone-white {
            background: radial-gradient(circle at 30% 30%, #fff 0%, #cbd5e1 100%);
            border: 1px solid #94a3b8;
            color: #0f172a;
        }

        /* 字体自适应：根据半径变量计算 */
        .win-rate-val {
            font-family: 'Orbitron', sans-serif;
            font-size: calc(var(--r) * 0.7px); /* 字体大小为半径的0.7倍 */
            line-height: 1;
            text-shadow: 0 0 10px rgba(0,242,255,0.5);
        }
        .rank-label {
            font-size: calc(var(--r) * 0.3px);
            font-weight: 800;
            text-transform: uppercase;
            opacity: 0.8;
            margin-bottom: 2px;
        }

        @keyframes ringPulse {
            0% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px var(--cyan-glow); }
            50% { transform: scale(1.15); opacity: 0.4; box-shadow: 0 0 25px var(--cyan-glow); }
            100% { transform: scale(1); opacity: 0.8; box-shadow: 0 0 10px var(--cyan-glow); }
        }

        @keyframes stonePop {
            from { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
            to { transform: translate(-50%, -50%) scale(1); opacity: 1; }
        }

        /* --- 悬浮球与菜单 --- */
        .floating-ball {
            width: 56px; height: 56px;
            background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.2); border-radius: 50%;
            position: absolute; right: 15px; top: 25%; z-index: 100;
            cursor: pointer; display: flex; justify-content: center; align-items: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5); transition: all 0.3s;
        }
        .floating-ball:hover { transform: scale(1.05) rotate(15deg); border-color: var(--cyan-glow); }

        .menu-pro {
            position: absolute; right: 15px; top: 25%; width: 310px;
            background: rgba(15, 23, 42, 0.9); backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1); border-radius: 36px;
            padding: 28px; color: white; z-index: 110; display: none;
            box-shadow: 0 40px 80px rgba(0,0,0,0.7);
        }

        .btn-grad {
            background: linear-gradient(135deg, #2563eb, #7000ff);
            width: 100%; padding: 16px; border-radius: 20px;
            font-weight: 800; letter-spacing: 1px; transition: all 0.3s;
        }
        .btn-grad:active { transform: scale(0.96); }

        .loader { width: 24px; height: 24px; border: 3px solid rgba(255,255,255,0.1); border-top-color: var(--cyan-glow); border-radius: 50%; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="phone">
    <img src="https://raw.githubusercontent.com/chengjiahua/image-to-sgf/master/test_images/board_01.jpg" class="board-bg">

    <div id="ai-overlay-layer" onclick="dismiss()">
        <!-- 推荐子 -->
    </div>

    <div class="floating-ball" onclick="openMenu()">
        <div class="w-8 h-8 rounded-full bg-black border-2 border-white shadow-inner"></div>
    </div>

    <div class="menu-pro" id="menu">
        <div class="flex justify-between items-center mb-8">
            <div>
                <p class="text-[10px] font-black text-slate-500 uppercase tracking-widest">Master AI</p>
                <h4 class="text-sm font-bold text-white flex items-center gap-2">
                    小米14-Pro Max <span id="lastLabel" class="text-[9px] bg-cyan-500/20 text-cyan-400 px-2 py-0.5 rounded">LAST: R4</span>
                </h4>
            </div>
            <button onclick="closeMenu()" class="p-2 hover:bg-white/10 rounded-full">✕</button>
        </div>

        <div class="mb-8">
            <p class="text-[10px] font-bold text-slate-500 mb-3 uppercase">选择行棋方 / SIDE</p>
            <div class="flex bg-black/40 p-1.5 rounded-2xl border border-white/5">
                <button id="setB" onclick="setSide('B')" class="flex-1 py-3 rounded-xl text-xs font-bold transition-all bg-white text-black">黑棋 (B)</button>
                <button id="setW" onclick="setSide('W')" class="flex-1 py-3 rounded-xl text-xs font-bold transition-all text-slate-400">白棋 (W)</button>
            </div>
        </div>

        <button onclick="analyze()" class="btn-grad flex justify-center items-center gap-3">
            <span id="btnText">立即启动分析</span>
            <div id="load" class="hidden loader"></div>
        </button>
    </div>
</div>

<script>
    let side = 'B';

    function openMenu() { document.getElementById('menu').style.display = 'block'; }
    function closeMenu() { document.getElementById('menu').style.display = 'none'; }
    
    function setSide(s) {
        side = s;
        document.getElementById('setB').className = s==='B' ? "flex-1 py-3 rounded-xl text-xs font-bold bg-white text-black" : "flex-1 py-3 rounded-xl text-xs font-bold text-slate-400";
        document.getElementById('setW').className = s==='W' ? "flex-1 py-3 rounded-xl text-xs font-bold bg-white text-black" : "flex-1 py-3 rounded-xl text-xs font-bold text-slate-400";
    }

    function analyze() {
        const t = document.getElementById('btnText');
        const l = document.getElementById('load');
        t.innerText = "正在解析局面...";
        l.classList.remove('hidden');

        setTimeout(() => {
            t.innerText = "立即启动分析";
            l.classList.add('hidden');
            
            // 模拟坐标数据
            // 假设棋子半径 r = 30px
            const radius = 30;
            const points = [
                {x: 187, y: 388, win: "68.4%", rank: "1", side: side},
                {x: 125, y: 326, win: "62.1%", rank: "2", side: side}
            ];

            renderPoints(points, radius);
            closeMenu();
        }, 1200);
    }

    function renderPoints(pts, r) {
        const layer = document.getElementById('ai-overlay-layer');
        layer.innerHTML = '';
        pts.forEach(p => {
            const container = document.createElement('div');
            container.className = 'ai-stone-container';
            // 将半径 r 传入 CSS 变量
            container.style.setProperty('--r', r);
            container.style.width = (r * 2) + 'px';
            container.style.height = (r * 2) + 'px';
            container.style.left = p.x + 'px';
            container.style.top = p.y + 'px';

            container.innerHTML = `
                <div class="energy-ring"></div>
                <div class="ai-stone-body ${p.side === 'B' ? 'stone-black' : 'stone-white'}">
                    <div class="rank-label">推荐 ${p.rank}</div>
                    <div class="win-rate-val">${p.win}</div>
                </div>
            `;
            layer.appendChild(container);
        });
        layer.style.display = 'block';
    }

    function dismiss() { document.getElementById('ai-overlay-layer').style.display = 'none'; }
</script>

</body>
</html>
