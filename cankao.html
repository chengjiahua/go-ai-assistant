<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Board Vision - Ultra Detailed Prototype</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap');
        
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-blue: #2563eb;
            --text-main: #f8fafc;
            --status-green: #22c55e;
            --status-red: #ef4444;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: #020617;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            color: var(--text-main);
        }

        /* 手机外壳容器 */
        .phone-frame {
            width: 380px;
            height: 820px;
            background-color: var(--bg-color);
            border: 12px solid #1e293b;
            border-radius: 54px;
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            box-shadow: 0 50px 100px rgba(0,0,0,0.8);
        }

        /* 首页内容区 */
        .dashboard {
            flex: 1;
            padding: 48px 32px;
            display: flex;
            flex-direction: column;
        }

        /* 1. Header 还原 */
        .header-logo {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
        }
        .logo-text { font-size: 36px; font-weight: 800; letter-spacing: -1px; }
        .logo-text span { color: #3b82f6; font-weight: 300; margin-left: 2px; }
        .sub-logo { font-size: 14px; color: #64748b; font-weight: 600; letter-spacing: 1px; margin-top: -4px; }
        
        .settings-btn {
            width: 52px;
            height: 52px;
            background-color: #1e293b;
            border-radius: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: all 0.2s;
        }
        .settings-btn:active { transform: scale(0.9); background-color: #334155; }

        /* 2. 权限卡片还原 */
        .status-section {
            background-color: #161e2e;
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 30px;
        }
        .section-title { font-size: 14px; color: #475569; font-weight: 800; margin-bottom: 20px; }
        
        .permission-row {
            background-color: #0f172a;
            padding: 18px 20px;
            border-radius: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            border: 1px solid rgba(255,255,255,0.03);
        }
        .row-left { display: flex; align-items: center; gap: 12px; font-size: 15px; font-weight: 600; }
        .dot { width: 8px; height: 8px; border-radius: 50%; }
        
        .btn-auth {
            font-size: 11px; font-weight: 800; padding: 8px 16px; border-radius: 100px;
        }
        .btn-ready { background-color: #1e293b; color: #94a3b8; }
        .btn-action { background-color: var(--accent-blue); color: white; box-shadow: 0 4px 15px rgba(37, 99, 235, 0.4); }

        /* 3. RUNNING 按钮还原 */
        .footer-action {
            margin-top: auto;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 16px;
        }
        .btn-running {
            width: 100%;
            padding: 24px;
            background-color: #161e2e;
            border-radius: 100px;
            text-align: center;
            font-size: 26px;
            font-weight: 900;
            color: var(--status-green);
            letter-spacing: 2px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        .running-status-text {
            font-size: 12px;
            color: var(--status-green);
            font-style: italic;
            font-weight: 500;
            opacity: 0.9;
        }

        /* 4. 悬浮窗逻辑还原 */
        .floating-icon {
            position: absolute;
            right: 20px;
            top: 150px; /* 位置参考图片 */
            width: 64px;
            height: 64px;
            background: rgba(30, 41, 59, 0.6);
            backdrop-filter: blur(10px);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            z-index: 100;
            border: 2px solid rgba(255,255,255,0.1);
        }
        .stone-wrap { position: relative; width: 34px; height: 34px; }
        .stone-b { width: 24px; height: 24px; background: #000; border-radius: 50%; position: absolute; left: 0; top: 0; border: 1px solid #444; }
        .stone-w { width: 24px; height: 24px; background: #fff; border-radius: 50%; position: absolute; right: 0; bottom: 0; border: 1px solid #ddd; }

        .hud-panel {
            position: absolute;
            right: 20px;
            top: 120px;
            width: 280px;
            background: rgba(15, 23, 42, 0.85);
            backdrop-filter: blur(30px);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 40px;
            padding: 24px;
            display: none;
            z-index: 110;
        }

        /* 5. 设置弹窗还原 */
        .modal-overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            display: none;
            justify-content: center;
            align-items: flex-end;
            z-index: 200;
        }
        .settings-card {
            width: 100%;
            background: #0f172a;
            border-radius: 40px 40px 0 0;
            padding: 40px 32px;
            border-top: 1px solid rgba(255,255,255,0.1);
        }

        input, select {
            width: 100%;
            background: #1e293b;
            border: 1px solid #334155;
            padding: 18px;
            border-radius: 20px;
            color: white;
            font-size: 14px;
            outline: none;
            margin-top: 8px;
        }
    </style>
</head>
<body>

    <div class="phone-frame">
        <!-- 首页 Dashboard -->
        <div class="dashboard">
            <div class="header-logo">
                <div>
                    <div class="logo-text">AI <span>VISION</span></div>
                    <div class="sub-logo">GO ANALYSIS ASSISTANT</div>
                </div>
                <div class="settings-btn" onclick="toggleModal(true)">
                    <svg class="w-6 h-6 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path></svg>
                </div>
            </div>

            <!-- 权限部分 -->
            <div class="status-section">
                <div class="section-title">系统权限状态</div>
                
                <div class="permission-row">
                    <div class="row-left">
                        <span class="dot" style="background-color: var(--status-green);"></span>
                        悬浮窗展示权限
                    </div>
                    <div class="btn-auth btn-ready">已授权</div>
                </div>

                <div class="permission-row" style="border-color: rgba(239, 68, 68, 0.2);">
                    <div class="row-left">
                        <span class="dot" style="background-color: var(--status-red);"></span>
                        屏幕录制/截图权限
                    </div>
                    <div class="btn-auth btn-action">立即开启</div>
                </div>
            </div>

            <!-- 底部运行按钮 -->
            <div class="footer-action">
                <div class="btn-running" onclick="toggleHUD(true)">RUNNING</div>
                <div class="running-status-text">悬浮服务已在后台运行</div>
            </div>
        </div>

        <!-- 设置弹窗 -->
        <div class="modal-overlay" id="settingsModal">
            <div class="settings-card animate__animated animate__slideInUp animate__faster">
                <h2 class="text-xl font-bold mb-6 italic">Application Settings</h2>
                <div class="space-y-6">
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">后端服务器地址</label>
                        <input type="text" value="http://192.168.1.100:8000" placeholder="Server URL">
                    </div>
                    <div>
                        <label class="text-xs font-bold text-slate-500 uppercase tracking-widest">适配模型 / 机型</label>
                        <select>
                            <option>小米 14 - 腾讯围棋 (野狐)</option>
                            <option>小米 14 - 弈城围棋</option>
                            <option>通用 - 标准 19路棋盘</option>
                        </select>
                    </div>
                    <div class="flex gap-4 pt-4">
                        <button class="flex-1 py-4 bg-slate-800 rounded-2xl font-bold" onclick="toggleModal(false)">返回</button>
                        <button class="flex-1 py-4 bg-blue-600 rounded-2xl font-bold text-white shadow-lg shadow-blue-900" onclick="toggleModal(false)">保存配置</button>
                    </div>
                </div>
            </div>
        </div>

        <!-- 悬浮球 -->
        <div class="floating-icon" id="bubble" onclick="expandHUD()">
            <div class="stone-wrap">
                <div class="stone-b"></div>
                <div class="stone-w"></div>
            </div>
        </div>

        <!-- 悬浮窗控制面板 (HUD) -->
        <div class="hud-panel animate__animated animate__fadeInRight animate__faster" id="hud">
            <div class="flex justify-between items-center mb-6">
                <div class="flex bg-slate-900 p-1 rounded-full border border-white/5">
                    <button id="btnB" onclick="setSide('B')" class="px-5 py-1.5 rounded-full text-[10px] font-black transition-all bg-white text-black">BLACK</button>
                    <button id="btnW" onclick="setSide('W')" class="px-5 py-1.5 rounded-full text-[10px] font-black transition-all text-slate-500">WHITE</button>
                </div>
                <button onclick="toggleHUD(false)" class="text-slate-400">✕</button>
            </div>
            
            <button class="w-full py-4 bg-blue-600 rounded-2xl font-black text-xs tracking-widest mb-6 active:scale-95 transition-all shadow-lg shadow-blue-900" onclick="simulateAnalyze()">
                AI ANALYZE
            </button>

            <div class="space-y-3" id="results">
                <p class="text-[9px] font-black text-slate-500 uppercase tracking-widest">KataGo Proposals</p>
                <!-- 模拟识别结果 -->
                <div class="flex items-center justify-between p-3.5 bg-slate-900/60 rounded-2xl border-l-4 border-red-500 opacity-40">
                    <span class="text-xs font-bold">1. 星位 (R4)</span>
                    <span class="text-[10px] font-mono text-red-400">Wait...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function toggleModal(show) {
            document.getElementById('settingsModal').style.display = show ? 'flex' : 'none';
        }

        function toggleHUD(show) {
            document.getElementById('bubble').style.display = show ? 'flex' : 'none';
            document.getElementById('hud').style.display = 'none';
        }

        function expandHUD() {
            document.getElementById('bubble').style.display = 'none';
            document.getElementById('hud').style.display = 'block';
        }

        function setSide(side) {
            const b = document.getElementById('btnB');
            const w = document.getElementById('btnW');
            if(side === 'B') {
                b.className = "px-5 py-1.5 rounded-full text-[10px] font-black transition-all bg-white text-black";
                w.className = "px-5 py-1.5 rounded-full text-[10px] font-black transition-all text-slate-500";
            } else {
                w.className = "px-5 py-1.5 rounded-full text-[10px] font-black transition-all bg-white text-black";
                b.className = "px-5 py-1.5 rounded-full text-[10px] font-black transition-all text-slate-500";
            }
        }

        function simulateAnalyze() {
            const res = document.getElementById('results');
            res.innerHTML += `<div class="flex items-center justify-between p-3.5 bg-slate-900 rounded-2xl border-l-4 border-red-500 animate__animated animate__fadeInLeft">
                <span class="text-xs font-bold text-white">1. R4 (点三三)</span>
                <span class="text-[10px] font-mono text-red-400 font-bold">58.2%</span>
            </div>`;
        }
    </script>
</body>
</html>
